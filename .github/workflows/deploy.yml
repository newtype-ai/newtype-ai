name: Deploy

on:
  push:
    branches: [main]

env:
  HAS_CLOUDFLARE_CREDS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      # Type-check worker code and run protocol validation tests.
      - run: npm test

      # Build Vite assets (badge first — empties outDir; card second — preserves badge output)
      - run: VITE_ENTRY=badge npx vite build
      - run: VITE_ENTRY=card npx vite build

      - run: npx wrangler d1 migrations apply nit-identity --remote
        if: env.HAS_CLOUDFLARE_CREDS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npx wrangler deploy
        if: env.HAS_CLOUDFLARE_CREDS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: echo "Cloudflare secrets are not configured; skipping Worker deploy."
        if: env.HAS_CLOUDFLARE_CREDS != 'true'

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@10 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm dlx wrangler pages deploy dist --project-name newtype-web --branch main
        if: env.HAS_CLOUDFLARE_CREDS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: echo "Cloudflare secrets are not configured; skipping Pages deploy."
        if: env.HAS_CLOUDFLARE_CREDS != 'true'

  production-smoke:
    runs-on: ubuntu-latest
    needs: [worker, website]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/production-smoke.mjs
        if: env.HAS_CLOUDFLARE_CREDS == 'true'
      - run: echo "Cloudflare secrets are not configured; skipping production smoke."
        if: env.HAS_CLOUDFLARE_CREDS != 'true'
