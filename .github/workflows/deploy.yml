name: Deploy

on:
  push:
    branches: [main]

env:
  HAS_CLOUDFLARE_CREDS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

jobs:
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - name: Require Cloudflare deploy secrets
        run: |
          if [ "$HAS_CLOUDFLARE_CREDS" != "true" ]; then
            {
              echo "### Cloudflare deploy secrets missing"
              echo
              echo "Set both repository secrets before using the Deploy workflow:"
              echo
              echo "- CLOUDFLARE_API_TOKEN"
              echo "- CLOUDFLARE_ACCOUNT_ID"
              echo
              echo "The token must be able to deploy Workers, deploy Pages, and apply D1 migrations for newtype-ai.org."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  worker:
    runs-on: ubuntu-latest
    needs: deploy-config
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      # Type-check worker code and run protocol validation tests.
      - run: npm test

      # Build Vite assets (badge first — empties outDir; card second — preserves badge output)
      - run: VITE_ENTRY=badge npx vite build
      - run: VITE_ENTRY=card npx vite build

      - run: npx wrangler d1 migrations apply nit-identity --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  website:
    runs-on: ubuntu-latest
    needs: deploy-config
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@10 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm dlx wrangler pages deploy dist --project-name newtype-web --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production-smoke:
    runs-on: ubuntu-latest
    needs: [worker, website]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/production-smoke.mjs
