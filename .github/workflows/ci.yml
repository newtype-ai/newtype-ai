name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run test:contract -- --nit-package @newtype-ai/nit@latest --sdk-package @newtype-ai/nit-sdk@latest
      - run: npm run build:all
